syntax = "proto3";

package github.nhassl3.pizzaland.PizzaLand;

import "third_party/googleapis/google/api/field_behavior.proto";
import "validate/validate.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.nhassl3.pizzaland.v1;pizzalndv1";

service PizzaLand {
  rpc Save(SaveRequest) returns (SaveResponse); // Save pizza procedure
  rpc Get(GetRequest) returns (GetResponse); // Get pizza procedure
  rpc List(ListRequest) returns (ListResponse); // Get list of the pizza procedure
  rpc Update(UpdateRequest) returns (UpdateResponse); // Update pizza properties or price procedure
  rpc Remove(RemoveRequest) returns (RemoveResponse); // Remove pizza from system procedure
  rpc SaveCategory(SaveCategoryRequest) returns (SaveCategoryResponse); // Save category for pizza on the system procedure
  rpc GetCategory(GetCategoryRequest) returns (GetCategoryResponse); // Get category object
  rpc GetCategoryList(GetCategoryListRequest) returns (GetCategoryListResponse); // Get list of the category procedure
  rpc UpdateCategory(UpdateCategoryRequest) returns (UpdateCategoryResponse); // Update category properties procedure
  rpc RemoveCategory(RemoveCategoryRequest) returns (RemoveCategoryResponse); // Remove category from the system procedure
  rpc SaveTypeDough(SaveTypeDoughRequest) returns (SaveTypeDoughResponse);
  rpc GetTypeDough(GetTypeDoughRequest) returns (GetTypeDoughResponse);
  rpc RemoveTypeDough(RemoveTypeDoughRequest) returns (RemoveTypeDoughResponse);
}

message SaveRequest {
  PizzaProperties pizza = 1;
}

message SaveResponse {
  uint64 pizza_id = 1;
}

message GetRequest {
  oneof identifier {
    uint64 pizza_id = 1 [
      (validate.rules).uint64.gt = 0
    ];
    string pizza_name = 2 [
      (validate.rules).string = {min_len: 3, max_len: 50}
    ];
  }
}

message GetResponse {
  PizzaProperties pizza = 1;
}

message ListRequest {
  optional google.protobuf.UInt32Value category_id = 4 [
    (validate.rules).uint32.gt = 0,
    (google.api.field_behavior) = OPTIONAL
  ];
  optional google.protobuf.StringValue category_name = 1 [
    (validate.rules).string = {min_len: 3, max_len: 26},
    (google.api.field_behavior) = OPTIONAL
  ];
  uint32 offset = 2 [
    (validate.rules).uint32.gte = 0,
    (google.api.field_behavior) = REQUIRED
  ];
  uint32 limit = 3 [
    (validate.rules).uint32 = {in: [12, 24, 36, 48]},
    (google.api.field_behavior) = REQUIRED
  ];
}

message ListResponse {
  repeated PizzaProperties pizza = 1;
}

message UpdateRequest {
  oneof identifier {
    uint64 id = 1 [
      (validate.rules).uint64.gt = 0
    ];
    string source_name = 2;
  }
  optional google.protobuf.UInt32Value category = 3 [
    (validate.rules).uint32.gt = 0,
    (google.api.field_behavior) = OPTIONAL
  ];
  optional google.protobuf.StringValue title = 4 [
    (validate.rules).string = {min_len: 3, max_len: 50},
    (google.api.field_behavior) = OPTIONAL
  ];
  optional google.protobuf.StringValue description = 5 [
    (validate.rules).string = {min_len: 16, max_len: 256},
    (google.api.field_behavior) = OPTIONAL
  ];
  repeated int32 types = 6 [
    (validate.rules).repeated = {
      items: {
        int32: { gt: 0 }
      },
      min_items: 1  // optional: ensure non-empty
    },
    (google.api.field_behavior) = OPTIONAL
  ];
  optional google.protobuf.FloatValue price = 7 [
    (validate.rules).float.gte = 109,
    (google.api.field_behavior) = OPTIONAL
  ];
  repeated int32 sizes = 8 [
    (validate.rules).repeated = {
      items: {
        int32: { gte: 26, lte: 40 },
      },
      min_items: 1  // optional: ensure non-empty
    },
    (google.api.field_behavior) = OPTIONAL
  ];
  optional google.protobuf.UInt32Value rating = 9 [
    (validate.rules).uint32 = {gte: 0, lte: 10},
    (google.api.field_behavior) = OPTIONAL
  ];
  optional google.protobuf.StringValue imageUrl = 10 [
    (google.api.field_behavior) = OPTIONAL
  ];
}

message UpdateResponse {
  bool success = 1;
}

message RemoveRequest {
  oneof identifier {
    uint64 pizza_id = 1 [
      (validate.rules).uint64.gt = 0
    ];
    string pizza_name = 2 [
      (validate.rules).string.min_len = 3
    ];
  }
}

message RemoveResponse {
  bool success = 1;
}

message SaveCategoryRequest {
  CategoryProperties category = 1;
}

message SaveCategoryResponse {
  uint32 category_id = 1;
}

message GetCategoryListRequest {
  oneof identifier {
    uint32 category_id = 4 [
      (validate.rules).uint32.gt = 0
    ];
    string category_name = 1 [
      (validate.rules).string = {min_len: 3, max_len: 26}
    ];
  }
  uint32 offset = 2 [
    (validate.rules).uint32.gte = 0,
    (google.api.field_behavior) = REQUIRED
  ];
  uint32 limit = 3 [
    (validate.rules).uint32 = {in: [12, 24, 36, 48]},
    (google.api.field_behavior) = REQUIRED
  ];
}

message GetCategoryRequest {
  oneof identifier {
    uint32 category_id = 1 [
      (validate.rules).uint32.gt = 0
    ];
    string category_name = 2 [
      (validate.rules).string.min_len = 3
    ];
  }
}

message GetCategoryResponse {
  CategoryProperties category = 1;
}

message GetCategoryListResponse {
  ListResponse pizza = 1;
}

message UpdateCategoryRequest {
  uint32 category_id = 3 [
    (validate.rules).uint32.gt = 0,
    (google.api.field_behavior) = REQUIRED
  ];
  optional google.protobuf.StringValue name = 1 [
    (validate.rules).string = {min_len: 3, max_len: 26},
    (google.api.field_behavior) = OPTIONAL
  ];
  optional google.protobuf.StringValue description = 2 [
    (validate.rules).string = {min_len: 16, max_len: 256},
    (google.api.field_behavior) = OPTIONAL
  ];
}

message UpdateCategoryResponse {
  bool success = 1;
}


message RemoveCategoryRequest {
  oneof identifier {
    uint32 category_id = 1 [
      (validate.rules).uint32.gt = 0
    ];
    string category_name = 2 [
      (validate.rules).string.min_len = 3
    ];
  }
}

message RemoveCategoryResponse {
  bool success = 1;
}

message SaveTypeDoughRequest {
  string name = 1 [
    (validate.rules).string = {min_len: 3, max_len: 32},
    (google.api.field_behavior) = REQUIRED
  ];
}

message SaveTypeDoughResponse {
  uint32 id = 1;
}

message GetTypeDoughRequest {
  uint32 id = 1 [
    (validate.rules).uint32.gt = 0,
    (google.api.field_behavior) = REQUIRED
  ];
}

message GetTypeDoughResponse {
  string name = 1;
}

message RemoveTypeDoughRequest {
  uint32 id = 1 [
    (validate.rules).uint32.gt = 0,
    (google.api.field_behavior) = REQUIRED
  ];
}

message RemoveTypeDoughResponse {
  bool success = 1;
}

// Composite structure for pizza properties
message PizzaProperties {
  optional google.protobuf.UInt64Value id = 1 [
    (validate.rules).uint64.gt = 0,
    (google.api.field_behavior) = OPTIONAL
  ];
  uint32 category = 2 [
    (validate.rules).uint32.gt = 0,
    (google.api.field_behavior) = OPTIONAL
  ];
  string title = 3 [
    (validate.rules).string = {min_len: 3, max_len: 50},
    (google.api.field_behavior) = REQUIRED
  ];
  google.protobuf.StringValue description = 4 [
    (validate.rules).string = {min_len: 16, max_len: 256},
    (google.api.field_behavior) = OPTIONAL
  ];
  repeated int32 types = 5 [
    (validate.rules).repeated = {
      items: {
        int32: { gt: 0 }
      },
      min_items: 1  // optional: ensure non-empty
    },
    (google.api.field_behavior) = REQUIRED
  ];
  float price = 6 [
    (validate.rules).float.gte = 109,
    (google.api.field_behavior) = REQUIRED
  ];
  repeated int32 sizes = 7 [
    (validate.rules).repeated = {
      items: {
        int32: { gte: 26, lte: 40 },
      },
      min_items: 1  // optional: ensure non-empty
    },
    (google.api.field_behavior) = REQUIRED
  ];
  uint32 rating = 8 [
    (validate.rules).uint32 = {gte: 0, lte: 10},
    (google.api.field_behavior) = OPTIONAL
  ];
  string imageUrl = 9 [
    (google.api.field_behavior) = REQUIRED
  ];
}

message CategoryProperties {
  optional google.protobuf.UInt32Value id = 1 [
    (validate.rules).uint32.gt = 0,
    (google.api.field_behavior) = OPTIONAL
  ];
  string name = 2 [
    (validate.rules).string = {min_len: 3, max_len: 26},
    (google.api.field_behavior) = REQUIRED
  ];
  optional google.protobuf.StringValue description = 3 [
    (validate.rules).string = {min_len: 16, max_len: 256},
    (google.api.field_behavior) = OPTIONAL
  ];
}